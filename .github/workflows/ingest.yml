name: ingest
on:
  schedule:
    # 6:20am, 12:20pm, 6:20pm Chicago (CDT; an hour earlier in CST)
    - cron: "20 11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/pyproject.toml
      - run: pip install -e "ingest[dev]"
      - name: Tests
        run: cd ingest && python -m pytest -q
      - name: Ingest
        run: cd ingest && python -m digest.run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Build site
        run: cd ingest && python -m digest.site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
