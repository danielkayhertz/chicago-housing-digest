[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-digest-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "pydantic>=2.7",
  "anthropic>=1.13,<2",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "jinja2>=3.1",
  "jsonschema>=4.0",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.setuptools.package-data]
digest = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
